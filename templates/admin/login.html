{% extends 'admin/base.html' %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div style="width: 100%; max-width: 400px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div class="cms-eyebrow">ACCESS</div>
            <h1 class="cms-page-title" style="font-size: 32px;">Portfolio CMS</h1>
            <p class="cms-body">Please log in to manage your portfolio content.</p>
        </div>
        
        <div class="cms-card cms-form">
            <form method="post">
                {% csrf_token %}
                
                {% if error %}
                <div class="cms-alert error">
                    {{ error }}
                </div>
                {% endif %}
                
                <div class="cms-form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="cms-form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button class="btn-primary" style="width: 100%;">Log In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
